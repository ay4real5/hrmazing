# Netlify configuration — HER-mazing Touch
# The site is plain static files, so there is no build step. Netlify only needs
# to know where the serverless functions live.

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"
  # shared/catalog.js sits outside the functions folder, so it must be declared
  # for the bundler to include it.
  included_files = ["shared/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
